<script>
  const music = document.getElementById('bgMusic');
  const delay = 1000;       // Delay before starting (2 seconds)
  const fadeDuration = 500; // Fade-in duration in milliseconds (3 seconds)

  setTimeout(() => {
    music.volume = 0;       // Start at 0 volume
    music.play().catch(e => console.log('Autoplay prevented:', e));

    const fadeSteps = 30; // Number of volume increments
    const stepTime = fadeDuration / fadeSteps; // Time per step
    let currentStep = 0;

    const fadeInterval = setInterval(() => {
      currentStep++;
      music.volume = Math.min(currentStep / fadeSteps, 1); // Gradually increase volume
      if (currentStep >= fadeSteps) clearInterval(fadeInterval);
    }, stepTime);

  }, delay);
</script>
<audio id="bgMusic" autoplay>
  <source src="audio/Shot-Trimmed.mp3" type="audio/mpeg">
</audio>

<body>
  <div class="container">
    <img src="images/File_explorer_Dead.png" class="PageTwoFolder">
  </div>

  <!-- Floating Characters -->
  <img src="images/Redacted.png" class="floater">
  <img src="images/Redacted.jpg" class="floater">
  <img src="images/Redacted.png" class="floater">
  <img src="images/Redacted.jpg" class="floater">
  <img src="images/Redacted.png" class="floater">
  <img src="images/Redacted.png" class="floater">


  <!-- File Explorer Animations -->

  <script>
    const floaters = document.querySelectorAll(".floater");
    const objects = [];

    floaters.forEach(el => {
      const x = (window.innerWidth - el.offsetWidth) / 2;
      const y = (window.innerHeight - el.offsetHeight) / 2;

      objects.push({
        el,
        x,
        y,
        vx: (Math.random() * 2 + 2) * (Math.random() > 0.5 ? 1 : -1),
        vy: (Math.random() * 2 + 2) * (Math.random() > 0.5 ? 1 : -1),
        rot: 0,
        rotDir: Math.random() > 0.5 ? 1 : -1
      });
    });

    function animate() {
      objects.forEach(o => {
        o.x += o.vx;
        o.y += o.vy;

        const w = o.el.offsetWidth;
        const h = o.el.offsetHeight;

        if (o.x <= 0 || o.x + w >= window.innerWidth) o.vx *= -1;
        if (o.y <= 0 || o.y + h >= window.innerHeight) o.vy *= -1;

        o.rot += 0.05 * o.rotDir;
        if (Math.abs(o.rot) > 2) o.rotDir *= -1;

        o.el.style.transform =
          `translate(${o.x}px, ${o.y}px) rotate(${o.rot}deg)`;
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>


</body>
